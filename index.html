<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d1a">
  <meta name="description" content="휴대폰으로 연주하는 시간의 오카리나. 12곡의 악보와 공식 굿즈 운지.">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>시간의 오카리나 · Hyrule Melody</title>
  <link rel="stylesheet" href="./style.css?v=20261113-landscape">
</head>
<body class="play-app">
  <header class="play-header">
    <span class="brand"><span class="crest" aria-hidden="true">✦</span> 시간의 오카리나</span>
    <button class="icon-button" id="menu-button" aria-label="메뉴 열기" aria-haspopup="dialog" aria-controls="menu-dialog" aria-expanded="false"><span class="hamburger" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </header>
  <main class="performance">
    <section class="instrument-stage" aria-label="오카리나 연주">
      <div id="main-instrument" class="instrument-mount"></div>
    </section>
    <section class="selected-score" aria-labelledby="practice-title">
      <div class="selected-heading"><h1 id="practice-title">젤다의 자장가</h1><button class="icon-button" id="clear-selection" aria-label="악보 접고 자유 연주">✕</button></div>
      <div class="selected-actions">
        <button class="primary-button" id="practice-play">▶ 재생</button>
        <button class="secondary-button" id="official-play">♫ 원곡</button>
        <button class="icon-button" id="practice-reset" aria-label="연습 다시 시작">↺</button>
      </div>
      <div id="practice-sequence" class="practice-sequence" aria-label="연주 순서"></div>
      <span id="practice-progress-label" class="sr-only" role="status"></span>
      <button class="score-link" id="score-link" aria-label="선택한 악보 크게 보기"><span id="score-viewer" class="score-viewer"></span><span class="score-expand" aria-hidden="true">⤢</span></button>
      <div id="score-empty" hidden></div>
    </section>
  </main>

  <dialog id="menu-dialog" class="menu-dialog" aria-labelledby="menu-title">
    <div class="modal-header"><h2 id="menu-title">메뉴</h2><button class="icon-button close-dialog" aria-label="메뉴 닫기">✕</button></div>
    <nav class="menu-tabs" aria-label="메뉴 항목">
      <button data-menu-page="songs" aria-pressed="true">악보</button>
      <button data-menu-page="settings" aria-pressed="false">설정</button>
      <button data-menu-page="sources" aria-pressed="false">자료</button>
    </nav>
    <section class="menu-panel" data-panel="songs" aria-label="악보 목록">
      <div class="library-toolbar"><div class="filters" aria-label="곡 분류"><button class="active" data-filter="all" aria-pressed="true">전체 12</button><button data-filter="utility" aria-pressed="false">모험</button><button data-filter="warp" aria-pressed="false">워프</button></div><button class="text-button" id="free-play">자유 연주</button></div>
      <div class="search-wrap"><label for="song-search" class="sr-only">곡 검색</label><input id="song-search" type="search" placeholder="곡 검색" autocomplete="off"></div>
      <div id="song-list" class="song-list"></div><p id="empty-results" class="empty-results" hidden>검색 결과 없음</p>
      <button class="scarecrow-card" id="scarecrow-button"><span aria-hidden="true">♧</span><strong>허수아비의 노래</strong><span aria-hidden="true">＋</span></button>
    </section>
    <section class="menu-panel" data-panel="settings" aria-label="연주 설정" hidden>
      <div class="instrument-modes" aria-label="연주 방식"><button data-mode="merch" aria-pressed="true">공식 굿즈 배열</button><button data-mode="simple" aria-pressed="false">간편 5음</button></div>
      <label class="setting-row">음량 <output id="volume-value">70%</output><input id="volume" type="range" min="0" max="100" value="70"></label>
      <label class="setting-row">연주 속도 <output id="tempo-value">100 BPM</output><input id="tempo" type="range" min="50" max="160" step="5" value="100"></label>
      <label class="setting-row">음높이<select id="octave"><option value="0">기본 · D5–D6</option><option value="-12">한 옥타브 낮게</option><option value="12">한 옥타브 높게</option></select></label>
      <label class="checkbox-row"><input id="haptics" type="checkbox" checked> 터치 진동</label>
    </section>
    <section class="menu-panel source-copy" data-panel="sources" aria-label="자료 안내" hidden>
      <p>비공식 팬 프로젝트. 직접 연주음은 합성음입니다.</p>
      <p>전체 악보와 원곡은 Nintendo 공식 서버에서 불러옵니다.</p>
      <a href="https://www.nintendo.com/jp/games/switch2/aa9ja/melody/index.html" target="_blank" rel="noopener noreferrer">Nintendo 공식 악보·음원 ↗</a>
      <a href="https://hori.jp/manual/nsx-261/" target="_blank" rel="noopener noreferrer">HORI 공식 운지표 ↗</a>
    </section>
  </dialog>

  <dialog id="scarecrow-dialog" class="small-dialog" aria-labelledby="custom-title">
    <div class="modal-header"><h2 id="custom-title">허수아비의 노래</h2><button class="icon-button close-dialog" aria-label="허수아비 노래 닫기">✕</button></div>
    <div id="custom-sequence" class="practice-sequence" aria-label="사용자 지정 8음"></div>
    <div id="custom-keys" class="custom-keys"></div>
    <div class="practice-tools"><button id="custom-clear" class="secondary-button">초기화</button><button id="custom-play" class="secondary-button" disabled>▶ 재생</button><button id="custom-select" class="primary-button" disabled>선택</button></div>
  </dialog>

  <dialog id="score-dialog" class="score-dialog" aria-labelledby="expanded-title">
    <div class="modal-header"><h2 id="expanded-title"></h2><a id="original-score-link" target="_blank" rel="noopener noreferrer">원본 ↗</a><button class="icon-button close-dialog" aria-label="확대 악보 닫기">✕</button></div>
    <div class="expanded-score"><img id="expanded-score-image" alt="" referrerpolicy="no-referrer"></div>
  </dialog>
  <div id="toast" role="status" class="toast"></div>
  <audio id="official-audio" preload="none"></audio>
  <script type="module" src="./app.js?v=20261113-landscape"></script>
</body>
</html>
